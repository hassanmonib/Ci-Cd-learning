
name: Deploy AWS Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
      - '.github/workflows/deploy-lambda.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile lambda/lambda_function.py

     
      - name: Install Python dependencies
        run: python -m pip install boto3
   

      
      - name: Run Lambda unit tests
        run: python -m unittest discover -s lambda -p "test_*.py" -v
  

     
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('Issuer:', payload.iss);
            console.log('Audience:', payload.aud);
            console.log('Subject:', payload.sub);

        

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::965825500168:role/GitHubActionsLambdaDeployRole
          aws-region: us-east-1

      - name: Package Lambda code
        run: |
          cd lambda
          zip ../lambda-deployment.zip lambda_function.py

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name s3-csv-processor \
            --zip-file fileb://lambda-deployment.zip \
            --region us-east-1
